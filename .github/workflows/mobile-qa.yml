name: mobile-qa

on:
  deployment_status:
  # Vercel posts commit statuses (context "Vercel"), not deployments, so this is the real preview trigger.
  status:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to test
        required: true
      pr:
        description: PR number to comment on (blank = none)
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: mobile-qa-${{ github.event.inputs.pr || github.event.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qa:
    # Self-hosted on the mini (GitHub-hosted minutes are blocked by billing, same as venn#986).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && startsWith(github.event.deployment_status.environment, 'Preview'))
      || (github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success' && github.event.target_url != '')
    runs-on: [self-hosted, venn-mini]
    timeout-minutes: 30
    env:
      PREVIEW_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      PR_NUMBER: ${{ github.event.inputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      QA_EXTRA_HEADERS: >-
        ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET && format('x-vercel-protection-bypass: {0}', secrets.VERCEL_AUTOMATION_BYPASS_SECRET) || '' }}
      STATUS_SHA: ${{ github.event.sha }}
    steps:
      # status events run the default branch's file at main's HEAD; the PR and preview URL come from the event sha.
      # The Vercel status target_url is the dashboard, so the preview URL is read from Vercel's PR comment.
      - name: Resolve PR and preview (status event)
        if: github.event_name == 'status'
        run: |
          if [ -z "$BYPASS" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS_SECRET not set; previews are behind Vercel auth, skipping (run workflow_dispatch instead)"
            echo SKIP=true >> "$GITHUB_ENV"; exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$STATUS_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$pr" ]; then echo "::notice::No open PR for $STATUS_SHA; skipping"; echo SKIP=true >> "$GITHUB_ENV"; exit 0; fi
          url=""
          for i in 1 2 3 4 5 6 7 8; do
            url=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --jq '.[] | select(.user.login == "vercel[bot]") | .body' | grep -o '\[Preview\](https://[^)]*)' | tail -1 | sed 's/.*(\(.*\))/\1/') || true
            [ -n "$url" ] && break; sleep 15
          done
          if [ -z "$url" ]; then echo "::error::No Vercel preview link on PR #$pr"; exit 1; fi
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"; echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
      - if: env.SKIP != 'true'
        uses: actions/checkout@v4
      - if: env.SKIP != 'true'
        run: npm ci
      - name: Playwright browsers (only if missing)
        if: env.SKIP != 'true'
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { chromium, webkit } from 'playwright';
            process.exit([chromium, webkit].every((b) => fs.existsSync(b.executablePath())) ? 0 : 1);
          " || npx playwright install chromium webkit
      - name: Preview reachable
        if: env.SKIP != 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: ${BYPASS}" "$PREVIEW_URL/")
          echo "$PREVIEW_URL -> $code"
          if [ "$code" = 401 ] || [ "$code" = 403 ]; then echo "::error::Preview is behind Vercel auth ($code); disable protection or fix VERCEL_AUTOMATION_BYPASS_SECRET"; exit 1; fi
      - name: Mobile QA
        if: env.SKIP != 'true'
        run: npm run qa:mobile "$PREVIEW_URL" -- --workers 2
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != 'true'
        with:
          name: mobile-qa
          path: qa/out
          if-no-files-found: ignore
      - name: PR comment
        if: always() && env.SKIP != 'true' && hashFiles('qa/out/report.json') != ''
        run: node scripts/qa/pr-comment.mjs
