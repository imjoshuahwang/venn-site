# Portal auth + ceremony flows for `npm run qa:portal`. Same syntax as flows.yaml, plus:
#   pending: <issue#>  skipped (never a pass) while that issue is open; remove when it merges. QA_PENDING=run overrides.
#   sign-in [email] | sign-out | new-context <name> | as <name> | expect-url <fragment>; {email} = the seeded test address.
#   reset-test-state | double-tap <sel> | expect-absent <sel> | expect-content <regex> | expect-no-content <regex> (page.content(), so hidden markup counts)
# Email fields only accept contact+portal-<slug>@joinvenn.org. Local Supabase only.
- name: auth-unauthenticated-redirect
  on: /portal
  steps:
    - expect-url /portal/login
    - expect-visible input[name=email]
    - screenshot login
- name: auth-wrong-password
  on: /portal/login
  steps:
    - fill "input[name=email]" {email}
    - fill "input[name=password]" definitely-wrong-password
    - tap button[type=submit]
    - expect-visible [role=alert]
    - expect-visible input[name=email]
    - screenshot error
- name: auth-reset
  on: /portal/reset
  steps:
    - fill "input[name=email]" {email}
    - tap button[type=submit]
    - expect-visible .status
    - screenshot sent
- name: auth-callback-bad-link
  on: /portal/auth/callback?code=bad
  steps:
    - expect-url /portal/resend?expired=1
    - expect-visible input[name=email]
    - screenshot expired
- name: auth-sign-in-sign-out
  on: /portal/login
  steps:
    - sign-in
    - expect-url /portal
    - screenshot signed-in
    - sign-out
    - goto /portal
    - expect-url /portal/login
- name: auth-set-password-first-visit
  on: /portal/set-password
  steps:
    - sign-in
    - goto /portal/set-password
    - fill "input[name=password]" {password}
    - tap button[type=submit]
    - expect-url /portal
    - screenshot ceremony
- name: auth-reused-expired-link
  on: /portal/auth/callback
  steps:
    - expect-visible main
- name: auth-resend-always-answers
  on: /portal/login
  steps:
    - expect-visible main
- name: auth-password-change-kills-other-device
  on: /portal/login
  steps:
    - sign-in
    - new-context b
    - as default
    - expect-visible main
- name: auth-turnstile-and-429
  on: /portal/login
  steps:
    - expect-visible main
- name: ceremony-cohort-first-visit
  on: /portal
  steps:
    - reset-ceremony cohort
    - sign-in
    - expect-visible [data-screen=sealed]
    - expect-visible "text=Your Fall '26 Result"
    - screenshot sealed
    - tap [data-reveal-btn]
    - expect-visible [data-headline]
    - screenshot reveal-start
    - wait 2000
    - screenshot reveal-mid
    - expect-visible [data-share]
    - screenshot letter
    - expect-visible "text=Test letter for cohort."
    - tap [data-share]
    - screenshot share
    - wait 3000
    - tap [data-next]
    - expect-url /portal
    - expect-gone [data-ceremony]
    - screenshot home
- name: ceremony-not-this-season
  on: /portal
  steps:
    - reset-ceremony nts
    - sign-in contact+portal-nts@joinvenn.org
    - expect-visible [data-screen=sealed]
    - screenshot sealed
    - tap [data-reveal-btn]
    - expect-visible "text=Not this season"
    - expect-visible "text=Test letter for nts."
    - wait 1600
    - screenshot letter
    - expect-visible [data-share]
    - tap [data-next]
    - expect-gone [data-ceremony]
    - screenshot home
- name: ceremony-reduced-motion
  on: /portal
  steps:
    - reset-ceremony cohort
    - sign-in
    - reduced-motion
    - expect-visible [data-screen=sealed]
    - tap [data-reveal-btn]
    - expect-visible "text=Test letter for cohort."
    - wait 400
    - screenshot letter
    - expect-visible [data-next]
    - tap [data-next]
    - expect-gone [data-ceremony]
    - screenshot home
- name: ceremony-second-visit-home
  on: /portal
  steps:
    - sign-in contact+portal-cohort-done@joinvenn.org
    - expect-url /portal
    - expect-gone [data-ceremony]
    - expect-visible main
- name: home
  on: /portal/login
  steps:
    - sign-in contact+portal-cohort-done@joinvenn.org
    - goto /portal?state=waiting-on-parent
    - expect-visible [data-next-step=waiting-on-parent]
    - screenshot waiting-on-parent
    - goto /portal?state=consent-missing
    - expect-visible [data-next-step=consent-missing]
    - screenshot consent
    - goto /portal?state=sign-mou
    - expect-visible [data-next-step=sign-mou]
    - screenshot sign-mou
    - goto /portal?state=guiding-questions
    - expect-visible [data-next-step=guiding-questions]
    - screenshot questions
    - goto /portal?state=text-josh
    - expect-visible [data-next-step=text-josh]
    - expect-visible [data-text-josh]
    - screenshot text-josh
    - goto /portal?state=kickoff-countdown
    - expect-visible [data-next-step=kickoff-countdown]
    - screenshot countdown
    - goto /portal?state=all-set
    - expect-visible [data-next-step=all-set]
    - expect-visible [data-pill][aria-disabled=false]
    - screenshot all-set
    - goto /portal?state=error
    - expect-visible [data-home-error]
    - screenshot error
- name: consent-ceremony
  on: /portal/login
  steps:
    - sign-in contact+portal-cohort-done@joinvenn.org
    - goto /portal/ceremony
    - expect-visible form.consent
- name: consent
  on: /portal/login
  steps:
    - reset-test-state
    - sign-in contact+portal-cohort-done@joinvenn.org
    - goto /portal/consent
    - expect-visible form.consent
    - expect-visible button:disabled
    - tap input[name=coordinator_groups] + .box
    - tap input[name=data_use] + .box
    - tap input[name=retention] + .box
    - tap input[name=highlights] + .box
    - screenshot consent-ready
    - tap text=Continue
    - screenshot home
- name: waitlist-network
  on: /portal/login
  steps:
    - sign-in contact+portal-network@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible text=You are on the Network waitlist
    - expect-visible text=Test letter for network.
    - expect-visible text=Early word on new Programs
    - expect-absent canvas
    - expect-visible a[href="mailto:contact@joinvenn.org"]
    - screenshot result
- name: waitlist-track
  on: /portal/login
  steps:
    - sign-in contact+portal-track@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible text=You are on the Track waitlist
    - expect-visible text=Test letter for track.
    - expect-visible text=after 5 days
    - expect-absent canvas
    - expect-visible a[href="mailto:contact@joinvenn.org"]
    - screenshot result
- name: not-this-season
  on: /portal/login
  steps:
    - sign-in contact+portal-nts@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible text=Not this Season
    - expect-visible text=Test letter for nts.
    - expect-visible text=Show something you built or ran
    - expect-absent canvas
    - expect-visible a[href="mailto:contact@joinvenn.org"]
    - screenshot result
- name: peer-mutual-tap
  on: /portal/login
  steps:
    - reset-test-state
    - sign-in contact+portal-peer-a@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-down]
    - expect-no-content mailto:(?!contact@joinvenn\.org)|tel:|contact\+portal-peer
    - new-context b
    - sign-in contact+portal-peer-b@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-down]
    - expect-no-content mailto:(?!contact@joinvenn\.org)|tel:|contact\+portal-peer
    - as default
    - tap [data-down]
    - expect-visible [data-waiting]
    - expect-no-content mailto:(?!contact@joinvenn\.org)|tel:|contact\+portal-peer
    - screenshot waiting
    - as b
    - goto /portal/result
    - expect-visible [data-down]
    - expect-no-content mailto:(?!contact@joinvenn\.org)|tel:|contact\+portal-peer
    - tap [data-down]
    - expect-visible [data-both]
    - expect-content contact\+portal-peer-a@joinvenn.org
    - screenshot both
    - as default
    - goto /portal/result
    - expect-visible [data-both]
    - expect-content contact\+portal-peer-b@joinvenn.org
    - expect-visible text=Josh will start your group
- name: peer-one-side-down
  on: /portal/login
  steps:
    - sign-in contact+portal-peer-one-a@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-waiting]
    - expect-no-content mailto:(?!contact@joinvenn\.org)|tel:|contact\+portal-peer
    - new-context b
    - sign-in contact+portal-peer-one-b@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-down]
    - expect-no-content mailto:(?!contact@joinvenn\.org)|tel:|contact\+portal-peer
    - screenshot one-side
- name: peer-already-both-down
  on: /portal/login
  steps:
    - sign-in contact+portal-peer-both-a@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-both]
    - expect-content contact\+portal-peer-both-b@joinvenn.org
- name: mou-sign
  on: /portal/login
  steps:
    - reset-test-state
    - sign-in contact+portal-cohort@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-mou] [data-name]
    - expect-visible [data-sign][aria-disabled=true]
    - tap [data-agree]
    - expect-visible [data-sign][aria-disabled=true]
    - fill [data-name] Test Person
    - expect-visible [data-sign][aria-disabled=false]
    - tap [data-agree]
    - expect-visible [data-sign][aria-disabled=true]
    - tap [data-agree]
    - double-tap [data-sign]
    - expect-visible [data-mou] [data-signed]
    - expect-no-content This MOU is already signed
    - goto /portal/result
    - expect-visible [data-mou] [data-signed]
    - screenshot signed
- name: mou-seat-cap-refused
  on: /portal/login
  steps:
    - reset-test-state
    - sign-in contact+portal-cohort-full@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - allow-error 409 /portal/mou
    - fill [data-name] Test Person
    - tap [data-agree]
    - tap [data-sign]
    - expect-visible [data-mou] [data-full]
- name: cohort-result-page
  on: /portal/login
  steps:
    - sign-in contact+portal-cohort@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-cohort] [data-letter]
    - expect-visible [data-cohort] [data-orgs]
    - screenshot cohort
- name: cohort-slides-and-questions
  on: /portal/login
  steps:
    - sign-in contact+portal-cohort@joinvenn.org
    - expect-url /portal
    - goto /portal/result
    - expect-visible [data-slides]
    - tap [data-next]
    - fill textarea[name=goal] Test answer
    - tap [data-guiding] [data-save]
    - expect-visible [data-guiding] [data-status]
    - expect-content Saved\. You can change
- name: parent-cosign-known-token
  on: /portal/login
  steps:
    - reset-test-state
    - goto /portal/parent/portal-seed-parent-token-local-only
    - expect-visible button:has-text("I agree")
    - tap button:has-text("I agree")
    - expect-content has been signed
    - goto /portal/parent/portal-seed-parent-token-local-only
    - expect-content has been signed
    - expect-absent button:has-text("I agree")
- name: team-lead-invite-and-member-view
  on: /portal/login
  steps:
    - reset-test-state
    - sign-in contact+portal-lead@joinvenn.org
    - goto /portal/team
    - expect-visible text=contact+portal-member-1@joinvenn.org
    - expect-visible text=Add co-founder
    - new-context m
    - sign-in contact+portal-member-1@joinvenn.org
    - goto /portal/team
    - expect-visible text=(you)
    - expect-absent text=Add co-founder
    - expect-absent text=Remove
- name: ceremony-draft-only
  on: /portal
  pending: 117
  steps:
    - sign-in contact+portal-draft@joinvenn.org
    - expect-visible main
    - expect-absent [data-letter]
- name: consent-under-18-routes-to-parent
  on: /portal/login
  pending: 136
  steps:
    - sign-in contact+portal-minor@joinvenn.org
    - goto /portal/consent
    - expect-url /portal/parent
- name: parent-token-reused-or-expired
  on: /portal/login
  steps:
    - reset-test-state
    - goto /portal/parent/portal-seed-parent-token-expired
    - expect-content expired or is not valid
    - expect-absent button:has-text("I agree")
- name: team-remove-loses-access
  on: /portal/login
  steps:
    - reset-test-state
    - sign-in contact+portal-lead@joinvenn.org
    - goto /portal/team
    - tap li:has-text("portal-member-1") button
    - expect-visible text=Co-founder removed.
    - new-context m
    - sign-in contact+portal-member-1@joinvenn.org
    - goto /portal/team
    - expect-absent text=(you)
