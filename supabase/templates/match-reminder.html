<div style="font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 20px;background:#fff;color:#111;font-size:16px;line-height:1.5">
<h1 style="font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-0.03em;margin:0 0 16px">{{ .Requester }} is still waiting</h1>
<p>Hi {{ .Name }},</p>
<p>A quick nudge about the note from {{ .Requester }} at {{ .Org }}. You can say yes or no, and either answer is fine. The link expires in about a day.</p>
<p style="margin:24px 0"><a href="{{ .Link }}" style="display:inline-block;background:#111;color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:999px">See the request</a></p>
<p style="color:#666;font-size:13px"><a href="{{ .StopLink }}" style="color:#666">Stop sending me requests</a></p>
<p>Joshua</p>
</div>
